# Environment variables (set via dashboard or wrangler secret)
# SUPERADMIN_EMAIL — email of the first superadmin
# GOOGLE_CLIENT_ID — Google OAuth client ID for ID token verification
# APPLE_CLIENT_ID — Apple Sign In service ID for ID token verification
# SESSION_SECRET — secret for signing session cookies
